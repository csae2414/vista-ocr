# Use this on the GPU VM. Adjust pytorch-cuda version to match the VM's
# installed CUDA toolkit (`nvidia-smi` -> top-right "CUDA Version").
# Common targets:
#   - CUDA 12.1 -> pytorch-cuda=12.1
#   - CUDA 12.4 -> pytorch-cuda=12.4
#
# Build with:
#   conda env create -f environment-cuda.yml
name: vista-ocr
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytorch::pytorch=2.4.*
  - pytorch::torchvision=0.19.*
  - pytorch::pytorch-cuda=12.1   # change if VM uses a different CUDA toolkit
  - pillow
  - opencv
  - pypdfium2
  - poppler
  - shapely
  - tqdm
  - numpy
  - scipy
  - pip:
      - transformers==4.44.2
      - tokenizers==0.19.1
      - sentencepiece==0.2.0
      - datasets==2.21.0
      - accelerate==0.34.2
      - webdataset==0.2.96
      - safetensors==0.4.5
      - pdf2image==1.17.0
      - faker==28.4.1
      - albumentations==1.4.15
      - jiwer==3.0.4
      - editdistance==0.8.1
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - wandb==0.17.9
      - pytest==8.3.3
      - pytest-cov==5.0.0
      - ruff==0.6.8
      - mypy==1.11.2
      - ipykernel==6.29.5
      # flash-attn requires a system CUDA toolkit (not bundled with PyTorch
      # wheels). Uncomment + install the toolkit if you have one. The
      # MBartForCausalLM SDPA path is also gated by HF transformers issue
      # #28005 for the full status.
      # - flash-attn==2.6.3
      - sphinx
      - sphinx-rtd-theme
      - sphinx-autodoc-typehints
      - myst-parser
