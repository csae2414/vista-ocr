name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system fonts (for SynthDOG tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fontconfig fonts-dejavu fonts-liberation poppler-utils

      - name: Install (CPU torch + project)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.44.2 tokenizers==0.19.1 sentencepiece==0.2.0 \
                      datasets==2.21.0 accelerate==0.34.2 webdataset==0.2.96 safetensors==0.4.5 \
                      pillow opencv-python-headless pypdfium2 shapely numpy scipy pdf2image \
                      faker==28.4.1 albumentations==1.4.15 jiwer==3.0.4 editdistance==0.8.1 \
                      omegaconf==2.3.0 hydra-core==1.3.2
          pip install pytest==8.3.3 ruff==0.6.8
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest -q --tb=short
