name: vista-ocr
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # CPU-only PyTorch for development on this box (no NVIDIA GPU detected).
  # On the GPU VM, recreate the env with the cuda variant in `environment-cuda.yml`
  # (to be added once we know the VM's CUDA toolkit version).
  - pytorch::pytorch=2.4.*
  - pytorch::torchvision=0.19.*
  - pytorch::cpuonly

  # Imaging / PDF
  - pillow
  - opencv
  - pypdfium2
  - poppler                # backs pdf2image
  - shapely                # IoU / DetEval polygon ops
  - tqdm
  - numpy
  - scipy

  - pip:
      # Hugging Face stack
      - transformers==4.44.2
      - tokenizers==0.19.1
      - sentencepiece==0.2.0
      - datasets==2.21.0
      - accelerate==0.34.2
      - webdataset==0.2.96
      - safetensors==0.4.5

      # PDF rendering / data prep
      - pdf2image==1.17.0

      # Synthetic data
      - faker==28.4.1
      - albumentations==1.4.15
      - albucore==0.0.16

      # Eval metrics
      - jiwer==3.0.4
      - editdistance==0.8.1

      # Logging / config
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - wandb==0.17.9

      # Dev
      - pytest==8.3.3
      - pytest-cov==5.0.0
      - ruff==0.6.8
      - mypy==1.11.2
      - ipykernel==6.29.5

      # Documentation
      - sphinx
      - sphinx-rtd-theme
      - sphinx-autodoc-typehints
      - myst-parser
